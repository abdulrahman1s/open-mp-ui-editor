[package]
name = "open-mp-ui-runtime"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Validated native textdraw UI runtime for open.mp"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
all = "warn"
